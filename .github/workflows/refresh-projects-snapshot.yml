name: Refresh projects snapshot

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-projects-snapshot.mjs

      - name: Commit if projects actually changed
        run: |
          # The snapshot embeds a generatedAt timestamp that differs on every
          # run, so a plain `git diff` always looks changed. Compare just the
          # `projects` field against what's already committed instead, and
          # only commit when the real content differs.
          OLD=$(git show HEAD:app/data/projects-snapshot.json 2>/dev/null | jq -S '.projects' || echo '[]')
          NEW=$(jq -S '.projects' app/data/projects-snapshot.json)
          if [ "$OLD" = "$NEW" ]; then
            echo "No real changes (only generatedAt differs) — skipping commit."
            git checkout -- app/data/projects-snapshot.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/projects-snapshot.json
          git commit -m "chore: refresh projects snapshot"
          git push
